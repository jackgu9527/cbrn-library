name: 每日戰情定時回報

on:
  schedule:
    # 這裡的時間是 UTC (台灣時間減 8 小時)
    - cron: '33 0 * * *'   # 台灣時間 08:33
    - cron: '33 1 * * *'   # 台灣時間 09:33
    - cron: '33 2 * * *'   # 台灣時間 10:33
    - cron: '33 5 * * *'   # 台灣時間 13:33
    - cron: '33 7 * * *'  # 台灣時間 15:33
    - cron: '33 9 * * *'   # 台灣時間 17:33
  workflow_dispatch: # 保留一個手動觸發按鈕，方便我們測試

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v3
        
      - name: 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 安裝套件
        run: |
          pip install psycopg2-binary pandas requests
          
      - name: 執行通訊兵腳本 (若無資料將自動靜默)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: python Documents.py
