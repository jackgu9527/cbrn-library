name: 自動發送學生二中隊報表

on:
  schedule:
    - cron: '0 9 * * 3,4'
  workflow_dispatch: 
    inputs:
      report_type:
        description: '手動測試：請選擇要強制發送的報表'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto         # 自動判斷 (依據當天星期幾)
          - wednesday    # 強制發送週三：借還書清單
          - thursday     # 強制發送週四：準則清點總表
          - custom       # 🌟 新增：發送自訂指定訊息
      custom_message:
        description: '📝 若上方選擇 custom，請在此輸入你要發送的文字'
        required: false
        type: string

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install psycopg2-binary pandas requests

      - name: Run Report Bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 改用 LINE 官方帳號的 Token 與群組 ID
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }} 
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          # 傳遞選單結果與自訂文字給 Python
          MANUAL_OVERRIDE: ${{ github.event.inputs.report_type || 'auto' }}
          CUSTOM_TEXT: ${{ github.event.inputs.custom_message }} 
        run: python Second student team.py
