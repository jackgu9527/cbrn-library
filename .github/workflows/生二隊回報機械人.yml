name: 自動發送學生二中隊報表

on:
  schedule:
    # 台灣時間每週三、週四的 17:00 (UTC 09:00) 執行
    - cron: '0 9 * * 3,4'
  workflow_dispatch: 
    # 加入輸入選項，讓手動執行時可以有下拉選單
    inputs:
      report_type:
        description: '手動測試：請選擇要強制發送的報表'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto         # 自動判斷 (依據當天星期幾)
          - wednesday    # 強制發送週三：借還書清單
          - thursday     # 強制發送週四：準則清點總表

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install psycopg2-binary pandas requests

      - name: Run Report Bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          # 將下拉選單的結果，傳遞給 Python 程式
          MANUAL_OVERRIDE: ${{ github.event.inputs.report_type || 'auto' }}
        run: python report_bot.py
